[project]
name = "das-server-python"
version = "0.1.0"
description = "DataWorks DataAgent OpenAPI 示例工程 · Python server 实现（与 Node server 同一 HTTP/NDJSON 契约）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "alibabacloud-dataworks-public20240518==9.9.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
