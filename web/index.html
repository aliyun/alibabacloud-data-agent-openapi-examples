<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover 不能省：没有它，iOS 上 env(safe-area-inset-*) 一律解析成 0，
      顶栏/底栏为刘海与 home 指示条留的 padding 就白写了。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Data Agent Workbench</title>
    <!--
      主题由 web-shell 自管（themeContext，默认暗色）。旧 UI 的 das.theme 内联脚本
      已随三栏 UI 一起移除——残留的 localStorage 键不再有任何效果。
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
